name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/worker/package-lock.json
      - name: Install server dependencies
        working-directory: server/worker
        run: npm ci
      - name: Typecheck the reference server
        working-directory: server/worker
        run: npx tsc --noEmit

  client-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check the trial client
        run: python -m py_compile server/worker/mb-trial-client.py
